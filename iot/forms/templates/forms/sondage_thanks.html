{% extends 'forms/base.html' %}

{% block title %}Merci ! | KaliForms{% endblock %}

{% block content %}
<div class="reveal" style="max-width: 600px; margin: 100px auto; text-align: center;">
    <div class="card sondage-header" style="padding: 4rem 2rem;">
        <div style="width: 64px; height: 64px; background: rgba(16, 185, 129, 0.1); color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem; font-size: 2rem;">
            ✓
        </div>
        <h1 class="sondage-title" style="font-size: 2rem;">Merci !</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 3rem;">Votre réponse pour <strong>{{ sondage.title }}</strong> a été enregistrée avec succès.</p>
        
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <a href="{% url 'sondage_view' sondage.id %}" class="btn btn-primary" style="height: 48px;">Envoyer une autre réponse</a>
            <a href="{% url 'home' %}" class="btn btn-outline" style="border:none; color: var(--text-muted);">Retour à l'accueil</a>
        </div>
    </div>
</div>
{% endblock %}
