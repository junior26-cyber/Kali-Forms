<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KaliForms | Data Intelligence{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --accent: #0070f3;
            --gray-100: #fafafa;
            --gray-200: #eaeaea;
            --gray-300: #999999;
            --gray-400: #888888;
            --gray-500: #666666;
            --radius: 8px;
            --shadow: 0 5px 10px rgba(0,0,0,0.12);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        nav {
            height: 64px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.8);
            backdrop-filter: saturate(180%) blur(5px);
            z-index: 1000;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.05em;
            text-decoration: none;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--fg);
            border-radius: 2px;
        }

        .btn {
            height: 40px;
            padding: 0 12px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-black {
            background: var(--fg);
            color: var(--bg);
        }

        .btn-black:hover {
            background: transparent;
            color: var(--fg);
            border-color: var(--fg);
        }

        .btn-ghost {
            color: var(--gray-500);
        }

        .btn-ghost:hover {
            background: var(--gray-100);
            color: var(--fg);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Base Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate { animation: slideIn 0.5s ease-out forwards; }

        footer {
            border-top: 1px solid var(--gray-200);
            padding: 3rem 0;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--gray-400);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <a href="{% url 'home' %}" class="logo">KaliForms</a>
        <div style="display: flex; gap: 8px;">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn btn-ghost">Dashboard</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-black">Sortir</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-ghost">Connexion</a>
                <a href="{% url 'signup' %}" class="btn btn-black">S'inscrire</a>
            {% endif %}
        </div>
    </nav>

    <div class="container" style="min-height: calc(100vh - 200px);">
        {% block content %}{% endblock %}
    </div>

    <footer>
        &copy; 2026 KaliForms Inc.
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
